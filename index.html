<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Fan Action - Milano 14 Nov 2026</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #080c14; color: #ffffff; padding: 15px; }
        .container { max-width: 480px; margin: 0 auto; background: #0f172a; border-radius: 20px; padding: 20px; border: 1px solid #1e293b; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        
        .header-card { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #1e293b; }
        .logo-circle { width: 42px; height: 42px; background: #3b82f6; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; }
        .title-area { flex-grow: 1; margin-left: 10px; text-align: left; }
        .title-area h2 { font-size: 15px; color: #fff; }
        .title-area p { font-size: 11px; color: #64748b; }
        
        .nav-buttons { display: flex; background: #1e293b; padding: 3px; border-radius: 10px; }
        .nav-btn { border: none; background: transparent; color: #94a3b8; padding: 6px 10px; font-size: 11px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .nav-btn.active { background: #2563eb; color: #fff; }

        .form-group { margin-bottom: 12px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-size: 12px; color: #94a3b8; }
        input, select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #020617; color: #fff; font-size: 14px; }
        .submit-btn { width: 100%; padding: 14px; border: none; border-radius: 10px; background: #2563eb; color: white; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 10px; }
        .sec-btn { width: 100%; padding: 12px; border: 1px solid #334155; border-radius: 10px; background: transparent; color: #94a3b8; font-weight: bold; font-size: 13px; cursor: pointer; margin-top: 10px; }

        /* SCHERMATA ISTRUZIONI / PREVIEW */
        #resultView { display: none; text-align: center; }
        .song-banner { background: rgba(245, 158, 11, 0.15); border: 1px solid #f59e0b; color: #fbbf24; padding: 12px; border-radius: 12px; font-size: 14px; font-weight: bold; margin-bottom: 15px; line-height: 1.4; }
        .color-preview-box { width: 100%; height: 80px; border-radius: 12px; margin: 15px 0; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; border: 1px solid rgba(255,255,255,0.2); }

        /* SCHERMO INTERO SOLO COLORE */
        #fullscreenColor { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100vw; height: 100vh; 
            z-index: 9999; 
        }
        .close-btn { 
            position: absolute; 
            top: 20px; right: 20px; 
            background: rgba(0,0,0,0.4); 
            color: #fff; 
            border: none; 
            width: 40px; height: 40px; 
            border-radius: 50%; 
            font-size: 20px; 
            font-weight: bold; 
            cursor: pointer; 
        }

        #dashboardView { display: none; text-align: left; }
        .stats-box { background: #1e293b; padding: 12px; border-radius: 10px; margin-bottom: 20px; }
        .stats-title { font-size: 13px; color: #f59e0b; font-weight: bold; display: flex; justify-content: space-between; margin-bottom: 6px; }
        .progress-bar { width: 100%; background: #020617; height: 8px; border-radius: 4px; overflow: hidden; }
        .progress-fill { background: #f59e0b; height: 100%; width: 0%; transition: width 0.5s; }

        .section-title { font-size: 11px; font-weight: bold; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { text-align: left; padding: 8px; color: #64748b; border-bottom: 1px solid #1e293b; }
        td { padding: 10px 8px; border-bottom: 1px solid #1e293b; color: #cbd5e1; }
        
        .badge { padding: 4px 8px; border-radius: 6px; font-weight: bold; font-size: 10px; display: inline-block; }
        .badge-VERDE { background: #15803d; color: #fff; }
        .badge-BIANCO { background: #e2e8f0; color: #000; }
        .badge-ROSSO { background: #b91c1c; color: #fff; }
        .badge-BLU { background: #1d4ed8; color: #fff; }
        .badge-TORCIA { background: #f59e0b; color: #000; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-card">
        <div class="logo-circle">B</div>
        <div class="title-area">
            <h2>BLUE FAN ACTION</h2>
            <p>14 NOV 2026 • UNIPOL FORUM</p>
        </div>
        <div class="nav-buttons">
            <button class="nav-btn active" id="btnPartecipa" onclick="switchTab('partecipa')">Partecipa</button>
            <button class="nav-btn" id="btnDashboard" onclick="openDashboard()">Dashboard</button>
        </div>
    </div>

    <!-- PARTECIPA -->
    <div id="partecipaView">
        <div class="form-group">
            <label>Nome e Cognome</label>
            <input type="text" id="nameInput" placeholder="Es. Giulia M.">
        </div>
        <div class="form-group">
            <label>Seleziona il tuo Settore</label>
            <select id="sectorSelect">
                <option value="">-- Scegli Settore --</option>
                <option value="Settore B28">Settore B28 (Verde)</option>
                <option value="Settore B29">Settore B29 (Bianco)</option>
                <option value="Settore A30">Settore A30 (Rosso)</option>
                <option value="Parterre">Parterre (Blu)</option>
                <option value="Tribune Laterali">Tribune Laterali (Torcia)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Fila e Posto (Opzionale)</label>
            <input type="text" id="seatInput" placeholder="Es. Fila 1 / Posto 12">
        </div>
        <button class="submit-btn" id="subBtn" onclick="registerUser()">Registrati & Genera Colore</button>
    </div>

    <!-- RIEPILOGO & ISTRUZIONI -->
    <div id="resultView">
        <div class="song-banner">
            🎵 Mostra questa schermata durante "A Chi Mi Dice"
        </div>
        <h3 id="resName"></h3>
        <p id="resSector" style="color: #94a3b8; font-size: 13px; margin-top: 4px;"></p>
        
        <div id="resColorPreview" class="color-preview-box"></div>

        <button class="submit-btn" style="background: #16a34a;" onclick="showFullscreen()">📲 Apri Colore a Schermo Intero</button>
        <button class="sec-btn" onclick="switchTab('partecipa')">Modifica Dati</button>
    </div>

    <!-- SCHERMO INTERO PURO -->
    <div id="fullscreenColor">
        <button class="close-btn" onclick="closeFullscreen()">✕</button>
    </div>

    <!-- DASHBOARD (AREA RISERVATA) -->
    <div id="dashboardView">
        <div class="stats-box">
            <div class="stats-title">
                <span>● Registrazioni Totali</span>
                <span id="statCount">0 iscritti</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="statBar"></div>
            </div>
        </div>

        <div class="section-title">Ultime Registrazioni</div>
        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Settore</th>
                    <th>Colore</th>
                    <th>Posto</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="4" style="text-align:center; color:#64748b;">Caricamento...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // Configurazione API Key & PIN
    const JSONBIN_KEY = "INCOLLA_QUI_LA_TUA_MASTER_KEY"; 
    const ADMIN_PIN = "1234"; 

    const colorRules = {
        'Settore B28': { color: '#15803d', text: 'VERDE', cls: 'badge-VERDE' },
        'Settore B29': { color: '#ffffff', text: 'BIANCO', textColor: '#000', cls: 'badge-BIANCO' },
        'Settore A30': { color: '#b91c1c', text: 'ROSSO', cls: 'badge-ROSSO' },
        'Parterre': { color: '#1d4ed8', text: 'BLU', cls: 'badge-BLU' },
        'Tribune Laterali': { color: '#f59e0b', text: 'TORCIA TELEFONO', textColor: '#000', cls: 'badge-TORCIA' }
    };

    let BIN_ID = localStorage.getItem('blue_bin_id') || '';
    let selectedColor = '#1d4ed8';

    function switchTab(tab) {
        document.getElementById('partecipaView').style.display = tab === 'partecipa' ? 'block' : 'none';
        document.getElementById('resultView').style.display = 'none';
        document.getElementById('fullscreenColor').style.display = 'none';
        document.getElementById('dashboardView').style.display = tab === 'dashboard' ? 'block' : 'none';
        document.getElementById('btnPartecipa').className = 'nav-btn ' + (tab === 'partecipa' ? 'active' : '');
        document.getElementById('btnDashboard').className = 'nav-btn ' + (tab === 'dashboard' ? 'active' : '');
    }

    async function registerUser() {
        const name = document.getElementById('nameInput').value;
        const sector = document.getElementById('sectorSelect').value;
        const seat = document.getElementById('seatInput').value || 'N/A';

        if(!name || !sector) { alert('Inserisci Nome e Settore!'); return; }

        const conf = colorRules[sector] || { color: '#1d4ed8', text: 'BLU', cls: 'badge-BLU' };
        selectedColor = conf.color;

        document.getElementById('resName').innerText = name;
        document.getElementById('resSector').innerText = sector + " • " + seat;
        
        const prevBox = document.getElementById('resColorPreview');
        prevBox.style.backgroundColor = conf.color;
        prevBox.style.color = conf.textColor || '#fff';
        prevBox.innerText = "Colore Assegnato: " + conf.text;

        document.getElementById('partecipaView').style.display = 'none';
        document.getElementById('resultView').style.display = 'block';

        if(JSONBIN_KEY !== "$2a$10$Bi2z7eWfCnRlDxNFv3PD/OvJKPs6pPvPThl2PFJgqOK3czGKN.x.u") {
            let currentData = await getData();
            currentData.push({ name: name, sector: sector, seat: seat, date: new Date().toISOString() });
            await saveData(currentData);
        }
    }

    function showFullscreen() {
        const full = document.getElementById('fullscreenColor');
        full.style.backgroundColor = selectedColor;
        full.style.display = 'block';
    }

    function closeFullscreen() {
        document.getElementById('fullscreenColor').style.display = 'none';
    }

    function openDashboard() {
        const pin = prompt("Inserisci il PIN per la Dashboard:");
        if (pin === ADMIN_PIN) {
            switchTab('dashboard');
            loadDashboardData();
        } else if(pin !== null) {
            alert("PIN Errato!");
        }
    }

    async function getData() {
        if(!BIN_ID) return [];
        try {
            let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': JSONBIN_KEY }
            });
            let json = await res.json();
            return json.record || [];
        } catch(e) { return []; }
    }

    async function saveData(data) {
        if(!BIN_ID) {
            let res = await fetch('https://api.jsonbin.io/v3/b', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_KEY, 'X-Bin-Private': 'false' },
                body: JSON.stringify(data)
            });
            let json = await res.json();
            if(json.metadata) {
                BIN_ID = json.metadata.id;
                localStorage.setItem('blue_bin_id', BIN_ID);
            }
        } else {
            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_KEY },
                body: JSON.stringify(data)
            });
        }
    }

    async function loadDashboardData() {
        let data = await getData();
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        document.getElementById('statCount').innerText = data.length + " iscritti";
        document.getElementById('statBar').style.width = Math.min((data.length / 500) * 100, 100) + "%";

        if(data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#64748b;">Nessuna registrazione ancora.</td></tr>';
            return;
        }

        data.reverse().slice(0, 15).forEach(row => {
            const conf = colorRules[row.sector] || { text: 'BLU', cls: 'badge-BLU' };
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><b>${row.name}</b></td>
                <td>${row.sector}</td>
                <td><span class="badge ${conf.cls}">${conf.text}</span></td>
                <td>${row.seat}</td>
            `;
            tbody.appendChild(tr);
        });
    }
</script>
</body>
</html>
